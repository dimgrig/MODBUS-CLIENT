# Dev-экспорт modbus-client из контейнера.
# Требует env: APP_VERSION (из VERSION), OUT_ROOT.
#
# Раскладка в контейнере: /opt/modbus-client/qt<N>/<ver>/
# Раскладка на хосте:     ${OUT_ROOT}/linux-qt6/
#
# Пользоваться через docker-export-core.sh (не напрямую).

services:
  modbus-client-linux-qt6:
    build:
      context: .
      dockerfile: Dockerfile.linux-qt6
      args:
        BASE_DEPS_IMAGE: base-deps-linux-qt6:latest
        CORE_SDK_VERSION: "${CORE_SDK_VERSION:-1.1.0}"
        CORE_SDK_URL: "${CORE_SDK_URL:-}"
        QT_VERSION_MAJOR: "6"
        QT6_INSTALL_PREFIX: "/opt/Qt/6.8.0/gcc_64"
        CORE_INSTALL_BASE: /opt/modbus-client
    image: modbus-client-builder-linux-qt6:latest
    volumes:
      - ${OUT_ROOT:?OUT_ROOT must be set}/linux-qt6:/out
    command: >
      sh -c "set -e
             rm -rf /out/*
             cp -r /opt/modbus-client/qt6/latest/. /out/
             chmod -R a+rX /out
             echo '--- /out/bin ---'
             ls -la /out/bin
             echo '--- /out/lib (head) ---'
             ls /out/lib | head -20"

  modbus-client-linux-qt5:
    build:
      context: .
      dockerfile: Dockerfile.linux
      args:
        BASE_DEPS_IMAGE: base-deps-linux:latest
        CORE_SDK_VERSION: "${CORE_SDK_VERSION:-1.1.0}"
        CORE_SDK_URL: "${CORE_SDK_URL:-}"
        QT_VERSION_MAJOR: "5"
        CORE_INSTALL_BASE: /opt/modbus-client
    image: modbus-client-builder-linux-qt5:latest
    volumes:
      - ${OUT_ROOT:?OUT_ROOT must be set}/linux-qt5:/out
    command: >
      sh -c "set -e
             rm -rf /out/*
             cp -r /opt/modbus-client/qt5/latest/. /out/
             chmod -R a+rX /out
             echo '--- /out/bin ---'
             ls -la /out/bin
             echo '--- /out/lib (head) ---'
             ls /out/lib | head -20"

  modbus-client-win64-qt6:
    build:
      context: .
      dockerfile: Dockerfile.win64-qt6
      args:
        BASE_DEPS_IMAGE: base-deps-win64-qt6:latest
        CORE_SDK_VERSION: "${CORE_SDK_VERSION:-1.1.0}"
        CORE_SDK_URL: "${CORE_SDK_URL:-}"
        CORE_SDK_PLATFORM: win64
        QT_VERSION_MAJOR: "6"
        QT6_INSTALL_PREFIX: "/opt/Qt/6.8.0/mingw_64"
        QT_HOST_PATH: "/opt/Qt/6.8.0/gcc_64"
        CMAKE_TOOLCHAIN_FILE: "/opt/x86_64-w64-mingw32.cmake"
        CORE_INSTALL_BASE: /opt/modbus-client
    image: modbus-client-builder-win64-qt6:latest
    volumes:
      - ${OUT_ROOT:?OUT_ROOT must be set}/win-qt6:/out
    command: >
      sh -c "set -e
             rm -rf /out/*
             cp -r /opt/modbus-client/qt6/latest/. /out/
             chmod -R a+rX /out
             echo '--- /out/bin (head) ---'
             ls /out/bin | head -30
             echo '--- /out/plugins ---'
             find /out/plugins -maxdepth 2 -type d | sort"

  modbus-client-win-qt5:
    build:
      context: .
      dockerfile: Dockerfile.win
      args:
        BASE_DEPS_IMAGE: base-deps-win:latest
        CORE_SDK_VERSION: "${CORE_SDK_VERSION:-1.1.0}"
        CORE_SDK_URL: "${CORE_SDK_URL:-}"
        CORE_SDK_PLATFORM: win32
        QT_VERSION_MAJOR: "5"
        CMAKE_CMD: i686-w64-mingw32-cmake
        CORE_INSTALL_BASE: /opt/modbus-client
    image: modbus-client-builder-win-qt5:latest
    volumes:
      - ${OUT_ROOT:?OUT_ROOT must be set}/win-qt5:/out
    command: >
      sh -c "set -e
             rm -rf /out/*
             cp -r /opt/modbus-client/qt5/latest/. /out/
             chmod -R a+rX /out
             echo '--- /out/bin (head) ---'
             ls /out/bin | head -30
             echo '--- /out/plugins ---'
             find /out/plugins -maxdepth 2 -type d | sort"